set -g @thm_maroon "#ea999c"
set -g @thm_peach "#ef9f76"
set -g @thm_yellow "#e5c890"
set -g @thm_green "#a6d189"
set -g @thm_teal "#81c8be"
set -g @thm_sky "#99d1db"
set -g @thm_sapphire "#85c1dc"
set -g @thm_blue "#8caaee"
set -g @thm_lavender "#babbf1"
set -g @thm_text "#c6d0f5"
set -g @thm_subtext1 "#b5bfe2"
set -g @thm_subtext0 "#a5adce"
set -g @thm_overlay2 "#949cbb"
set -g @thm_overlay1 "#838ba7"
set -g @thm_overlay0 "#737994"
set -g @thm_surface2 "#626880"
set -g @thm_surface1 "#51576d"
set -g @thm_surface0 "#414559"
set -g @thm_base "#303446"
set -g @thm_mantle "#292c3c"
set -g @thm_crust "#232634"

set -g @plugin 'thewtex/tmux-mem-cpu-load'


# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_surface2},fg=default,bold] 󰆧 #S },#{#[bg=default,fg=#{@thm_surface2},bold] 󰆧 #S }}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay0},none,bold]"

# status right look and feel
set -g status-right-length 100
set -g status-right ""

# Configure Tmux
set -g status-position top
set -g status-style "bg=default"
set -g status-justify "left"

# pane border look and feel
setw -g pane-border-status off
# setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-border-style "bg=default,fg=#{@thm_overlay0}"
setw -g pane-active-border-style "bg=default,fg=#{@thm_red}"
setw -g pane-border-lines single

# window style
set -g window-status-style "bg=default,fg=#{@thm_surface1}"
set -g window-status-last-style "bg=default,fg=#{@thm_surface2}"
set -g window-status-current-style "bg=default,fg=#{@thm_blue},bold"
set -g window-status-activity-style "bg=default,fg=#{@thm_surface0},bold"
set -g window-status-bell-style "bg=default,fg=#{@thm_text},bold"

# window content (icon)
set -g automatic-rename off
set -g allow-rename off
set -g window-status-format '\
#{?#{==:#{pane_current_command},zsh},  #W ,\
#{?#{==:#{pane_current_command},fish}, 󰈺 #W ,\
